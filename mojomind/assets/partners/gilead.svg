<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none" width="100%" height="100%">
  <defs>
    <filter id="gilead-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <linearGradient id="gilead-red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3344" />
      <stop offset="100%" stop-color="#d61f26" />
    </linearGradient>
  </defs>

  <g filter="url(#gilead-glow)">
    <!-- Gilead Leaf / Swoosh Icon -->
    <g transform="translate(6, 8)">
      <!-- Left solid leaf -->
      <path d="M12 42 C 6 36, 4 22, 14 10 C 24 22, 22 36, 12 42 Z" fill="url(#gilead-red-grad)" />
      <!-- Right curved wing -->
      <path d="M17 12 C 30 6, 42 16, 36 34 C 32 20, 24 14, 17 12 Z" fill="url(#gilead-red-grad)" />
    </g>

    <!-- GILEAD Typography -->
    <g transform="translate(62, 38)" fill="#ffffff" font-family="'Poppins', 'Arial Black', sans-serif" font-weight="900" font-size="28" letter-spacing="4px">
      <text x="0" y="0">GILEAD</text>
    </g>
  </g>
</svg>
