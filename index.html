<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script>
    if (location.protocol === 'http:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      location.replace(`https://${location.host}${location.pathname}${location.search}${location.hash}`);
    }
  </script>
  <title>MojaMind — Creative Resilience</title>
  <meta name="description" content="MojaMind — an 8-week creative resilience intervention. Express yourself through art, voice, 3D space, and journal notes. Powered by SHOUT-IT-NOW & Stellenbosch University, made possible by Gilead. Designed & crafted by Johan Wilhelm van Antwerp (Antwerp Designs · Ionity www.ionity.co.za)." />
  <meta name="theme-color" content="#1A1A1A" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MojaMind" />
  <link rel="canonical" href="https://ionity.art/" />
  <meta property="og:title" content="MojaMind — Creative Resilience" />
  <meta property="og:description" content="An 8-week creative resilience intervention. Express yourself through art, voice, words, 3D space, and journal notes." />
  <meta property="og:url" content="https://www.ionity.co.za/" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://www.ionity.co.za/assets/icons/icon-512.png" />
  <meta name="author" content="Johan Wilhelm van Antwerp — Solutionist of Antwerp Designs &amp; Ecosystems Engineer · Ionity (Pty) Ltd (www.ionity.co.za)" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" href="./assets/branding/mojomind-logo.png" />
  <link rel="apple-touch-icon" href="./assets/branding/mojomind-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="./css/app.css?v=2.8.1" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "MojaMind",
    "url": "https://www.ionity.co.za",
    "description": "Creative resilience intervention PWA with art, voice, journal, 2D meadow and 3D cosmic games.",
    "author": {
      "@type": "Person",
      "name": "Johan Wilhelm van Antwerp",
      "jobTitle": "Solutionist & Ecosystems Engineer",
      "url": "https://www.ionity.co.za",
      "sameAs": [
        "https://www.ionity.world",
        "https://www.linkedin.com/in/ionity",
        "https://github.com/AntwerpDesignsIonity"
      ]
    },
    "creator": {
      "@type": "Organization",
      "name": "Ionity (Pty) Ltd",
      "url": "https://www.ionity.co.za"
    }
  }
  </script>
</head>
<body>
  <div id="stars" aria-hidden="true"></div>
  <div id="phone">
    <main id="app" aria-live="polite"></main>
    <!-- Unified Vertical Right-Side Sidebar: Topline Settings & Quick Creative Tabs -->
    <aside id="vertical-sidebar" class="vertical-sidebar hidden" aria-label="Quick Settings and Exploration Sidebar">
      <button class="vs-toggle" id="vs-toggle" aria-label="Toggle Sidebar" title="Collapse / Expand Sidebar">
        <span class="vs-toggle-arrow">›</span>
      </button>

      <div class="vs-inner">
        <!-- Gear: reveals the settings group -->
        <button class="vs-btn vs-gear-btn" id="vs-gear" data-vs="gear" title="Settings" aria-label="Settings" aria-expanded="false">
          <span class="vs-icon">⚙️</span>
          <span class="vs-tooltip">Settings</span>
        </button>

        <!-- Topline Settings Section (revealed by the gear) -->
        <div class="vs-group vs-settings-group">
          <button class="vs-btn" data-vs="soundscape" title="432Hz Ambient Soundscapes" aria-label="Soundscapes">
            <span class="vs-icon">🎧</span>
            <span class="vs-tooltip">432Hz Audio</span>
            <span class="vs-dot sound-dot" id="vs-sound-dot"></span>
          </button>

          <button class="vs-btn" data-vs="voice" title="Voice Studio &amp; Dictation" aria-label="Voice Navigation">
            <span class="vs-icon">🎙️</span>
            <span class="vs-tooltip">Voice Studio</span>
            <span class="vs-dot voice-dot" id="vs-voice-dot"></span>
          </button>

          <button class="vs-btn" data-vs="a11y" title="Accessibility &amp; Font Size" aria-label="Accessibility">
            <span class="vs-icon">♿</span>
            <span class="vs-tooltip">Accessibility</span>
          </button>

          <button class="vs-btn" data-vs="care" title="Ithemba Hope Sanctuary" aria-label="Hope Sanctuary">
            <span class="vs-icon">🌸</span>
            <span class="vs-tooltip">Hope Sanctuary</span>
          </button>

          <button class="vs-btn" data-vs="help" title="Help &amp; Study Guide" aria-label="Help and Guide">
            <span class="vs-icon">❓</span>
            <span class="vs-tooltip">Help &amp; FAQ</span>
          </button>
        </div>

        <div class="vs-divider"></div>

        <!-- Exploration Section -->
        <div class="vs-group vs-explore-group">
          <button class="vs-btn vs-spark-btn" data-vs="spark" title="Daily Spark &amp; Creative Exploration" aria-label="Daily Spark">
            <span class="vs-icon vs-spark-icon">✨</span>
            <span class="vs-tooltip">Daily Spark</span>
          </button>

          <button class="vs-btn vs-release-btn" data-vs="pixelthoughts" title="Cosmic Thought Release" aria-label="Cosmic Release">
            <span class="vs-icon">🧘</span>
            <span class="vs-tooltip">Cosmic Release</span>
          </button>
        </div>
      </div>
    </aside>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="assertive"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <!-- Core Shell (Deferred for instantaneous initial paint) -->
  <script src="./js/data.js?v=3.5.0" defer></script>
  <script src="./js/vault.js?v=3.5.0" defer></script>
  <script src="./js/sync.js?v=3.5.0" defer></script>
  <script src="./js/nlp.js?v=3.5.0" defer></script>
  <script src="./js/llm.js?v=3.5.0" defer></script>
  <script src="./js/voice.js?v=3.5.0" defer></script>
  <script src="./js/video.js?v=3.5.0" defer></script>
  <script src="./js/app.js?v=3.5.0" defer></script>
</body>
</html>
